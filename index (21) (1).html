<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#30565c"><link rel="manifest" href="manifest.json"><title>ابن رشد الأهلية جازان – بنين 360°</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;background:#f1f6f4;color:#24474b;font:16px system-ui,sans-serif;padding-bottom:90px}header{background:linear-gradient(130deg,#30565c,#54856b);color:white;text-align:center;padding:28px 16px;border-radius:0 0 32px 32px}header img{width:105px;border-radius:18px}h1{font-size:24px;margin:12px 0 4px}h2{font-size:19px}header strong{font-size:36px;color:#c9e6d5}main{max-width:1000px;margin:auto;padding:18px}input,select,textarea,button{font:inherit;border:1px solid #cbdad4;border-radius:12px;padding:12px;min-width:0}input,select,textarea{width:100%;background:white}button{cursor:pointer;background:#30565c;color:white;border:0}button.alt{background:#e2eeea;color:#30565c}button.danger{background:#a33d3d} .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile,section{background:white;border:1px solid #e0e9e4;border-radius:18px;padding:16px;box-shadow:0 4px 14px #30565c0b}.tile a{display:block;color:inherit;text-decoration:none;overflow-wrap:anywhere}.tile p{font-size:13px;color:#526b69}.tile .symbol{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:14px;color:white;font-size:23px}.line{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.line>*{flex:1}nav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:center;gap:8px;padding:12px;box-shadow:0 -4px 20px #30565c15}nav button{background:white;color:#30565c;flex:1;max-width:180px;font-size:14px}form{display:grid;gap:10px}section{margin:12px 0}small{color:#526b69}#status{white-space:pre-wrap} [hidden]{display:none!important}@media(min-width:700px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style><header><img src="logo.jpg" alt="شعار مدارس ابن رشد"><h1>ابن رشد الأهلية جازان – بنين</h1><strong>360°</strong><div>البوابة الرقمية الموحدة</div><small style="color:white">منظومة متكاملة ... نحو التميز المؤسسي</small></header><main><p id="status" role="status"></p><div id="home"><input id="search" placeholder="ابحث عن منصة أو خدمة" aria-label="بحث"><p><select id="filter" aria-label="التصنيف"></select></p><h2 id="heading">منصاتنا الرقمية</h2><div id="cards" class="grid"></div></div><section id="admin" hidden><h2>إدارة البوابة</h2><form id="login"><input id="email" type="email" placeholder="البريد الإلكتروني" required><input id="password" type="password" placeholder="كلمة المرور" required><button>دخول المدير</button></form><div id="manage" hidden><button id="logout" class="alt">تسجيل الخروج</button><h2>إضافة أو تعديل منصة</h2><form id="platform"><input id="pid" type="hidden"><input id="pname" placeholder="اسم المنصة" required><input id="url" type="url" placeholder="https://" required><textarea id="desc" placeholder="الوصف"></textarea><select id="cat"></select><label>الأيقونة <select id="ico"><option value="layout-grid">▦ منصة</option><option value="book">📚 تعليم</option><option value="chart">📊 تقارير</option><option value="users">👥 فريق</option><option value="star">★ مبادرة</option></select></label><label>اللون <input id="color" type="color" value="#30565c"></label><label>الترتيب <input id="order" type="number" value="0"></label><label><input id="active" type="checkbox" checked style="width:auto"> إظهار المنصة</label><button>حفظ المنصة</button><button type="button" class="alt" id="reset">إلغاء التعديل</button></form><div id="plist"></div><h2>إدارة التصنيفات</h2><form id="category"><input id="cid" type="hidden"><input id="cname" required placeholder="اسم التصنيف"><input id="corder" type="number" value="0" aria-label="ترتيب التصنيف"><button>حفظ التصنيف</button><button type="button" class="alt" id="creset">إلغاء التعديل</button></form><div id="clist"></div></div></section></main><nav><button id="navhome">⌂ الرئيسية</button><button id="navfav">♡ المفضلة</button><button id="navadmin">⚙ الإدارة</button></nav><script>
const $=id=>document.getElementById(id), db=supabase.createClient('https://tuojlwdfqoiohkkcuqqj.supabase.co','sb_publishable_6ohoPmG4cUZslRgMtV15rw_2KSMU5Lr');let cats=[],platforms=[],admin=false,favOnly=false;let fav=[];try{fav=JSON.parse(localStorage.getItem('portal360fav')||'[]')}catch{}const symbols={'layout-grid':'▦',book:'📚',chart:'📊',users:'👥',star:'★'};function msg(s){$('status').textContent=s||''}function node(tag,text,cls){let e=document.createElement(tag);if(text!=null)e.textContent=text;if(cls)e.className=cls;return e}function btn(t,fn,cls='alt'){let b=node('button',t,cls);b.type='button';b.onclick=fn;return b}function options(el,first){let old=el.value;el.replaceChildren(new Option(first,''),...cats.map(c=>new Option(c.name,c.id)));el.value=old}function safe(s){try{let u=new URL(s);return ['https:','http:'].includes(u.protocol)?u.href:null}catch{return null}}const defaults=[{id:'original',name:'دليل البرامج والخدمات المدرسية',url:'https://ibnrushd-programs.fa-maashi.chatgpt.site/',icon:'layout-grid',color:'#54856b',is_active:true,description:'المنصة الحالية'},{id:'plan',name:'الخطة التشغيلية',url:'https://ali400483-cpu.github.io/ibn-roshd-1/',icon:'chart',color:'#30565c',is_active:true,description:'متابعة الخطة التشغيلية'}];
async function load(){let [c,p]=await Promise.all([db.from('portal360_categories').select('*').order('sort_order'),db.from('portal360_platforms').select('*').order('sort_order')]);if(c.error||p.error){msg('تعذر تحميل البيانات: '+(c.error||p.error).message);return}cats=c.data;platforms=p.data;options($('filter'),'جميع التصنيفات');options($('cat'),'بدون تصنيف');render();manage()}
function render(){let q=$('search').value.trim(),cat=$('filter').value;let items=platforms.filter(p=>p.is_active);$('cards').replaceChildren();for(let p of items.filter(p=>(!cat||p.category_id===cat)&&(!favOnly||fav.includes(p.id))&&(p.name+' '+(p.description||'')).includes(q))){let d=node('article',null,'tile'),a=node('a'),s=node('span',symbols[p.icon]||'▦','symbol');s.style.background=/^#[0-9a-f]{6}$/i.test(p.color)?p.color:'#30565c';let link=safe(p.url);if(link){a.href=link;a.target='_blank';a.rel='noopener noreferrer'}a.append(s,node('h3',p.name),node('p',p.description||''));d.append(a,btn(fav.includes(p.id)?'♥ المفضلة':'♡ حفظ',()=>{fav=fav.includes(p.id)?fav.filter(x=>x!==p.id):[...fav,p.id];localStorage.setItem('portal360fav',JSON.stringify(fav));render()}));$('cards').append(d)}if(!$('cards').children.length)$('cards').append(node('p','لا توجد منصات مطابقة.'))}
async function write(table,id,data){if(!admin)return;let r=id?await db.from(table).update(data).eq('id',id):await db.from(table).insert(data);if(r.error){msg(r.error.message);return false}msg('تم الحفظ');await load();return true}async function remove(table,id){if(!admin||!confirm('تأكيد الحذف؟'))return;let r=await db.from(table).delete().eq('id',id);if(r.error)msg(r.error.message);else{msg('تم الحذف');await load()}}
function manage(){if(!admin)return;$('plist').replaceChildren();if(!platforms.length){$('plist').append(btn('إضافة الرابطين المعروفين',async()=>{for(let {id,...p} of defaults)await write('portal360_platforms',null,p)}))}for(let p of platforms){let d=node('section');d.append(node('b',p.name+(p.is_active?'':' (مخفية)')),btn('تعديل',()=>{for(let [k,v] of Object.entries({pid:p.id,pname:p.name,url:p.url,desc:p.description,cat:p.category_id,ico:p.icon,color:p.color,order:p.sort_order}))$(k).value=v??'';$('active').checked=p.is_active;$('platform').scrollIntoView()}),btn('حذف',()=>remove('portal360_platforms',p.id),'danger'));$('plist').append(d)}$('clist').replaceChildren();for(let c of cats){let d=node('section');d.append(node('b',c.name),btn('تعديل',()=>{$('cid').value=c.id;$('cname').value=c.name;$('corder').value=c.sort_order}),btn('حذف',()=>remove('portal360_categories',c.id),'danger'));$('clist').append(d)}}
$('platform').onsubmit=async e=>{e.preventDefault();if(!safe($('url').value)){msg('الرابط غير صالح');return}if(await write('portal360_platforms',$('pid').value,{name:$('pname').value,description:$('desc').value,url:$('url').value,category_id:$('cat').value||null,icon:$('ico').value,color:$('color').value,sort_order:Number($('order').value),is_active:$('active').checked}))$('reset').click()};$('reset').onclick=()=>{$('platform').reset();$('pid').value=''};$('category').onsubmit=async e=>{e.preventDefault();if(await write('portal360_categories',$('cid').value,{name:$('cname').value,sort_order:Number($('corder').value)}))$('creset').click()};$('creset').onclick=()=>{$('category').reset();$('cid').value=''};async function auth(){let {data}=await db.auth.getSession();let r=data.session?await db.rpc('portal360_is_admin'):{};admin=r.data===true;$('manage').hidden=!admin;$('login').hidden=admin;if(data.session&&!admin)msg('الحساب غير مخول بإدارة البوابة');await load()}$('login').onsubmit=async e=>{e.preventDefault();let r=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});$('password').value='';if(r.error)msg(r.error.message);else await auth()};$('logout').onclick=async()=>{await db.auth.signOut();await auth()};$('search').oninput=render;$('filter').onchange=render;function nav(a,f){$('admin').hidden=!a;$('home').hidden=a;favOnly=f;$('heading').textContent=f?'المفضلة':'منصاتنا الرقمية';render()}$('navhome').onclick=()=>nav(false,false);$('navfav').onclick=()=>nav(false,true);$('navadmin').onclick=()=>nav(true,false);auth().catch(e=>msg(e.message));if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></html>
